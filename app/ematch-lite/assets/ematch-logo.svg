<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 400 140" width="400" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=DM+Sans:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" fill="#0A1628"/>

  <!-- Fingerprint mark — centered at (90, 110) -->
  <g transform="translate(90,110)">
    <line x1="0" y1="-62" x2="0" y2="62" stroke="#253D56" stroke-width="0.8"/>
    <!-- Left arcs — amber -->
    <path d="M0,-8  A8,8,0,0,0,0,8"   fill="none" stroke="#F5A623" stroke-width="3"   stroke-linecap="round"/>
    <path d="M0,-14 A14,14,0,0,0,0,14" fill="none" stroke="#F5A623" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M0,-20 A20,20,0,0,0,0,20" fill="none" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,-28 A28,28,0,0,0,0,28" fill="none" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M0,-36 A36,36,0,0,0,0,36" fill="none" stroke="#F5A623" stroke-width="2"   stroke-linecap="round"/>
    <path d="M0,-46 A46,46,0,0,0,0,46" fill="none" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,-56 A56,56,0,0,0,0,56" fill="none" stroke="#F5A623" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Right arcs — slate -->
    <path d="M0,-8  A8,8,0,0,1,0,8"   fill="none" stroke="#8AA4BE" stroke-width="3"   stroke-linecap="round"/>
    <path d="M0,-14 A14,14,0,0,1,0,14" fill="none" stroke="#8AA4BE" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M0,-20 A20,20,0,0,1,0,20" fill="none" stroke="#8AA4BE" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,-28 A28,28,0,0,1,0,28" fill="none" stroke="#8AA4BE" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M0,-36 A36,36,0,0,1,0,36" fill="none" stroke="#8AA4BE" stroke-width="2"   stroke-linecap="round"/>
    <path d="M0,-46 A46,46,0,0,1,0,46" fill="none" stroke="#8AA4BE" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,-56 A56,56,0,0,1,0,56" fill="none" stroke="#8AA4BE" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Centre pivot -->
    <circle r="5.5" fill="#F5A623"/>
    <circle r="2.5" fill="#0A1628"/>
  </g>

  <!-- Wordmark: amber e + white Match -->
  <text x="182" y="98" font-family="'Playfair Display',Georgia,serif" font-size="52" font-weight="700" fill="#F5A623">e</text>
  <text x="214" y="98" font-family="'Playfair Display',Georgia,serif" font-size="52" font-weight="700" fill="#FFFFFF">Match</text>

  <!-- Sub-label -->
  <text x="182" y="122" font-family="'DM Sans',Arial,sans-serif" font-size="11" fill="#4A6080" letter-spacing="2">AI JOB MATCHING PLATFORM</text>
</svg>
